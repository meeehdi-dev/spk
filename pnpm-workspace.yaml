allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: false
  sharp: true
  vue-demi: false
minimumReleaseAgeExclude:
  - knip@6.45.0
peerDependencyRules:
  allowedVersions:
    # Assets are generated by the standalone CLI; Nuxt's optional integration is disabled.
    '@vite-pwa/nuxt>@vite-pwa/assets-generator': '2'
    'vite-plugin-pwa>@vite-pwa/assets-generator': '2'
