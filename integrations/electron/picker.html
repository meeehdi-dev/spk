<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'" />
    <title>Share your screen</title>
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #18181b;
        color: #fafafa;
        font:
          14px system-ui,
          sans-serif;
      }
      main {
        flex: 1;
        overflow: auto;
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      h2 {
        margin: 16px 0 8px;
        font-size: 13px;
        color: #a1a1aa;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
      }
      .grid button {
        display: grid;
        gap: 6px;
        padding: 8px;
        border: 2px solid #3f3f46;
        border-radius: 8px;
        background: #27272a;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .grid button:hover,
      .grid button:focus-visible {
        border-color: #fafafa;
        outline: none;
      }
      .grid img.thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        background: #000;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .name img {
        width: 16px;
        height: 16px;
      }
      .name span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-top: 1px solid #3f3f46;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #cancel {
        padding: 8px 14px;
        border: 1px solid #3f3f46;
        border-radius: 6px;
        background: #27272a;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Share your screen</h1>
      <section id="screens" hidden>
        <h2>Screens</h2>
        <div class="grid"></div>
      </section>
      <section id="windows" hidden>
        <h2>Windows</h2>
        <div class="grid"></div>
      </section>
    </main>
    <footer>
      <label id="audio-label" hidden><input id="audio" type="checkbox" checked />Share audio</label>
      <button id="cancel" type="button">Cancel</button>
    </footer>
    <script src="picker-ui.js"></script>
  </body>
</html>
