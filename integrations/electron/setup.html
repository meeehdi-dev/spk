<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>spk</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #18181b;
        color: #fafafa;
        font:
          16px system-ui,
          sans-serif;
      }
      form {
        display: grid;
        gap: 12px;
        width: min(420px, 90vw);
      }
      input,
      button {
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #3f3f46;
        background: #27272a;
        color: inherit;
        font: inherit;
      }
      button {
        cursor: pointer;
        background: #fafafa;
        color: #18181b;
      }
      [role='alert'] {
        min-height: 1.25em;
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <form>
      <label for="server">spk server URL</label>
      <input id="server" type="text" placeholder="https://spk.example.com" autocomplete="url" spellcheck="false" required autofocus />
      <button type="submit">Connect</button>
      <div role="alert"></div>
    </form>
    <script src="setup.js"></script>
  </body>
</html>
