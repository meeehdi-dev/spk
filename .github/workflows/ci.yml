name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up tools
        uses: jdx/mise-action@v5.2.7

      - name: Configure pnpm
        run: |
          corepack enable pnpm
          echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/node/corepack
            ${{ runner.temp }}/pnpm-store
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare

      - name: Check unused code and dependencies
        run: pnpm knip

      - name: Check duplication
        run: pnpm jscpd

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  docker:
    name: Docker build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: https://github.com/${{ github.repository }}.git#${{ github.sha }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
